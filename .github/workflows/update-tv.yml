
name: Update Indian TV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate organised playlists
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from pathlib import Path
          from collections import defaultdict

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "gnaidu05/iptv/main/playlists/"
              "india-active.m3u"
          )

          request = urllib.request.Request(
              SOURCE,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(request, timeout=60) as r:
              content = r.read().decode("utf-8-sig")

          if not content.lstrip().startswith("#EXTM3U"):
              raise ValueError("Source is not an M3U playlist")

          lines = content.splitlines()
          channels = []

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:"):
                  continue

              if "," not in line:
                  continue

              name = line.split(",", 1)[1].strip()
              match = re.search(
                  r'group-title="([^"]*)"', line
              )
              original_group = (
                  match.group(1) if match else ""
              )

              url = None
              extras = []

              for following in lines[i + 1:]:
                  following = following.strip()
                  if following.startswith("#EXTINF:"):
                      break
                  if following.startswith("#"):
                      extras.append(following)
                  elif following:
                      url = following
                      break

              if not url or not url.startswith(
                  ("https://", "http://")
              ):
                  continue

              channels.append(
                  (name, line, extras, url, original_group)
              )

          if len(channels) < 100:
              raise ValueError(
                  f"Unexpected channel count: {len(channels)}"
              )

          def classify(name, original):
              n = name.lower()
              g = original.lower()

              rules = [
                  ("News", [
                      "news", "samachar", "aaj tak",
                      "aajtak", "ndtv", "republic",
                      "abp", "tv9", "cnn", "bbc",
                      "india today", "cnbc", "zee 24",
                      "sandesh", "v6 news"
                  ]),
                  ("Sports", [
                      "sports", "sport", "cricket",
                      "football", "tennis", "espn"
                  ]),
                  ("Movies", [
                      "movies", "movie", "cinema",
                      "film", "pictures", "cineplex",
                      "star gold", "sony max"
                  ]),
                  ("Kids", [
                      "kids", "cartoon", "pogo",
                      "nickelodeon", "disney junior",
                      "hungama", "sonic", "baby tv"
                  ]),
                  ("Music", [
                      "music", "9xm", "beats",
                      "b4u music", "mtv", "zing"
                  ]),
                  ("Religious", [
                      "aastha", "bhajan", "sanskar",
                      "devotional", "darshan",
                      "spiritual", "temple", "god tv"
                  ]),
                  ("Entertainment", [
                      "entertainment", "star plus",
                      "star bharat", "star jalsha",
                      "star maa", "star pravah",
                      "star vijay", "sony sab",
                      "sony tv", "colors", "zee tv",
                      "serial", "comedy", "drama"
                  ])
              ]

              for category, keywords in rules:
                  if any(k in n for k in keywords):
                      return category

              mapping = {
                  "news": "News",
                  "sports": "Sports",
                  "movies": "Movies",
                  "music": "Music",
                  "kids": "Kids",
                  "animation": "Kids",
                  "religious": "Religious",
                  "entertainment": "Entertainment",
                  "comedy": "Entertainment",
                  "general": "General",
                  "documentary": "Documentary",
                  "education": "Education",
                  "lifestyle": "Lifestyle",
                  "business": "Business",
                  "cooking": "Lifestyle",
                  "travel": "Travel",
                  "culture": "Culture"
              }

              for part in re.split(r"[;,|]", g):
                  part = part.strip()
                  if part in mapping:
                      return mapping[part]

              return "General"

          def make_entry(channel, group):
              name, line, extras, url, _ = channel

              if re.search(r'group-title="[^"]*"', line):
                  line = re.sub(
                      r'group-title="[^"]*"',
                      lambda m: f'group-title="{group}"',
                      line,
                      count=1
                  )
              else:
                  pos = line.find(",")
                  line = (
                      line[:pos]
                      + f' group-title="{group}"'
                      + line[pos:]
                  )

              return [line, *extras, url]

          playlists = defaultdict(list)

          for channel in channels:
              name, _, _, _, old_group = channel
              group = classify(name, old_group)

              playlists["india-tv"].append(
                  make_entry(channel, group)
              )

              slug = group.lower().replace(" ", "-")
              playlists[slug].append(
                  make_entry(channel, group)
              )

              # Language-specific collections are
              # additional playlists, not exclusive groups.
              name_lower = name.lower()
              old_lower = old_group.lower()

              if (
                  re.search(
                      r'\b(gujarati|guj|gu)\b',
                      name_lower + " " + old_lower
                  )
                  or any(x in name_lower for x in [
                      "gujarat", "gujarati", "asmita",
                      "girnar", "sandesh"
                  ])
              ):
                  playlists["gujarati"].append(
                      make_entry(channel, "Gujarati")
                  )

              if re.search(
                  r'\b(hindi|hin)\b',
                  name_lower + " " + old_lower
              ):
                  playlists["hindi"].append(
                      make_entry(channel, "Hindi")
                  )

          for slug, entries in sorted(playlists.items()):
              output = ["#EXTM3U"]

              for entry in entries:
                  output.extend(entry)

              filename = (
                  "india-tv.m3u"
                  if slug == "india-tv"
                  else f"india-{slug}.m3u"
              )

              Path(filename).write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )
              print(filename, len(entries))

          print("Total channels:", len(channels))
          PY

      - name: Commit playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.m3u'
          if ! git diff --cached --quiet; then
            git commit -m "Update organised Indian TV playlists"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
